# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# This file ships inside the great-docs package and declares every setting at
# its default value. It is the single source of truth for those defaults: the
# in-memory DEFAULT_CONFIG is parsed from this file, and the commented template
# written by `great-docs init` is this file with the value lines commented out.

# Module Name
# -----------
# Importable module name, when it differs from the project name
# (e.g. project 'py-yaml12' imports as 'yaml12'). Auto-detected when null.
module: null

# Display Name
# ------------
# Custom display name for your package in the site navbar/title.
# If not provided, uses the actual package name (e.g., 'my_package' or 'my-package').
# Use this to provide a marketing/presentation name (e.g., 'My Package').
display_name: null

# Project Type
# ------------
# Primary ecosystem(s) the project belongs to. Controls which
# ecosystem-specific links and features are active by default.
#   "python"          — Python package (default); enables PyPI link
#   "go"              — Go CLI/library; disables PyPI link by default
#   ["python", "go"]  — mixed project (e.g. a Python package with a Go sidecar)
project_type: python

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
# This value was auto-detected during initialization, but can be overridden here.
parser: numpy

# Dynamic Introspection
# ---------------------
# When true, the renderer uses runtime introspection (more accurate for complex packages).
# When false, uses static analysis only (better for packages with cyclic aliases).
# This value was auto-detected during initialization based on what works for your
# package, but can be overridden here.
dynamic: true

# Jupyter Kernel
# --------------
# Jupyter kernel to use for executing code cells in .qmd files.
# This is set at the project level so it applies to all pages, including
# auto-generated API reference pages. Can be overridden in individual .qmd
# file frontmatter if needed for special cases.
jupyter: python3

# Exclusions
# ----------
# Items to exclude from auto-documentation (affects 'init' and 'scan')
# exclude:
#   - InternalClass
#   - helper_function
exclude: []

# Names to force-include even if they match AUTO_EXCLUDE
auto_include: []

# Bypass the built-in AUTO_EXCLUDE list entirely
no_auto_exclude: false

# PyPI Link
# ---------
# true (default): auto-detect the package name and link to pypi.org
# false: disable the PyPI link
# str: custom package index URL (e.g. "https://artifactory.example.com/pkg")
pypi: true

# GitHub Integration
# ------------------
# GitHub repository URL override (e.g. "https://github.com/owner/repo").
repo: null

# GitHub link style: "widget" (shows stars count) or "icon" (simple icon)
github_style: widget

# Site URL
# --------
# Canonical address of the deployed docs site. Used for skills-page install
# commands, .well-known/ discovery, sitemaps, and subdirectory deployments;
# also sets website.site-url in _quarto.yml.
site_url: null

# Source Link Configuration
# -------------------------
source:
  enabled: true              # Enable/disable source links (default: true)
  branch: null               # Git branch/tag to link to (default: auto-detect)
  path: null                 # Custom source path for monorepos (default: auto-detect)
  placement: usage           # Where to place the link: "usage" (default) or "title"

# Sidebar Filter
# --------------
sidebar_filter:
  enabled: true              # Enable/disable filter (default: true)
  min_items: 20              # Minimum items before showing filter (default: 20)

# CLI Documentation
# -----------------
# cli:
#   enabled: false             # Enable CLI documentation (default: false)
#   module: my_package.cli     # Module containing Click commands (auto-detected)
#   name: cli                  # Name of the Click command object (auto-detected)
#   title: CLI Reference       # Optional title for the CLI index page + sidebar section
#   desc: >-                   # Optional intro paragraph shown atop the CLI index page
#     Command-line interface for my-package.
#   sections:                  # Optional explicit grouping/ordering for the CLI index page.
#     - title: Project setup   # When omitted, commands are auto-grouped in code order
#       desc: Create and configure a project.
#       contents: [init, config]
#     - title: Building
#       contents: [build, preview]
cli:
  enabled: false
  module: null
  name: null
  title: null
  desc: null
  sections: []

# Go CLI Documentation
# --------------------
# Builds the Go binary and extracts its command tree via --help. Works with any
# Go CLI (Cobra, urfave/cli, ...) whose subcommands support --help.
go_cli:
  enabled: false

# MCP Server Documentation
# ------------------------
# Auto-generates reference pages from an MCP server's tool/resource/prompt
# definitions.
mcp:
  enabled: true
  # Importable module path containing the MCP server (e.g. "sweet.mcp").
  module: null
  # Variable name of the Server instance; auto-detected when null.
  server_var: null
  # Display name override; defaults to the server name.
  name: null
  # Manual tool categories: {"Category Name": ["tool_a", "tool_b"]}.
  categories: {}

# Dark Mode Toggle
# ----------------
# Enable/disable the dark mode toggle in navbar (default: true)
dark_mode_toggle: true

# Author Information
# ------------------
# Author metadata for display in the landing page sidebar and page attribution
# authors:
#   - name: Your Name
#     email: you@example.com
#     role: Lead Developer
#     affiliation: Organization
#     github: yourusername
#     homepage: https://yoursite.com
#     orcid: 0000-0002-1234-5678
#     image: https://github.com/yourusername.png  # Avatar (GitHub URL or local path)
authors: []

# Funding
# -------
# Funding organization (copyright holder / funder).
# Example: {"name": "Posit Software, PBC", "roles": ["Copyright holder", "funder"], "ror": "https://ror.org/03wc8by49"}
funding: null

# Site Settings
# -------------
# These settings are forwarded to _quarto.yml (format.html section)
#
# `site` is a pure Quarto passthrough: its entire subtree is merged into
# `format.html`, so any valid `format.html` key works here with no great-docs
# change. `css` is the one exception (great-docs copies the file and references
# it by basename). The great-docs page/UI settings that used to live here
# (language, show_dates, date_format, show_author, show_security) are top-level
# keys below; setting them under `site` still works and is lifted automatically.
# site:
#   theme: flatly              # Quarto theme (default: flatly)
#   toc: true                  # Show table of contents (default: true)
#   toc-depth: 2               # TOC heading depth (default: 2)
#   html-math-method: katex    # HTML math renderer (default: katex; e.g., mathjax)
#   toc-title: On this page    # TOC title (default: "On this page")
site:
  theme: flatly
  toc: true
  toc-depth: 2
  html-math-method: katex

# Page Metadata
# -------------
# Language for UI text (BCP 47 code, e.g., "en", "fr", "de", "ja", "zh-Hans")
# Translates navbar labels, widget text, tooltips, and accessibility labels
language: en

# Show page timestamps in footer
show_dates: false

# Date format (Python strftime)
date_format: "%B %d, %Y"

# Show author attribution with dates
show_author: true

# Show security policy page (from SECURITY.md)
show_security: true

# Team Author
# -----------
# Optional catch-all author for auto-generated pages (reference, changelog, etc.)
# team_author:
#   name: "Project Team"
#   image: "assets/team-avatar.png"
#   url: "https://github.com/org/project"
team_author: null

# Changelog (GitHub Releases)
# ---------------------------
# Auto-generate a Changelog page from GitHub Releases.
changelog:
  enabled: true              # Enable/disable changelog (default: true)
  max_releases: 50           # Max releases to include (default: 50)

# Custom Sections
# ---------------
# Add custom page groups (examples, tutorials, blog, etc.) to the site.
# Each section gets a navbar link and a sidebar. An auto-generated
# card-based index page is created only when `index: true` is set;
# otherwise the navbar links directly to the first page in the section.
# If you provide your own index.qmd in the directory it is always used.
#
# sections:
#   - title: Examples            # Navbar link text
#     dir: examples              # Source directory (relative to project root)
#     index: true                # Generate card-based index page (default: false)
#     index_columns: 2           # Columns for image cards: 1 or 2 (default: 2)
#     navbar_after: User Guide   # Place after this navbar item (optional)
#   - title: Tutorials
#     dir: tutorials             # No index — navbar links to first page
#   - title: Blog                # Blog section using Quarto's listing directive
#     dir: blog
#     type: blog                 # "blog" for Quarto listing, omit for card grid
sections: []

# Custom Static Pages
# -------------------
# Add hand-written HTML pages that Great Docs should either wrap with the site
# shell (layout: passthrough) or copy through unchanged (layout: raw).
#
# Omit `custom_pages` to use the conventional `custom/` directory.
# Set `custom_pages: false` to disable discovery.
#
# custom_pages:
#   - dir: marketing             # Source directory (relative to project root)
#     output: py                 # URL/output prefix (optional; defaults to dir basename)
#   - dir: playgrounds
#     output: demos
#
# Short form for a single directory:
# custom_pages: marketing
custom_pages: null

# Homepage
# --------
# "index" (default): separate homepage from the README / index source
# "user_guide": the first user-guide page becomes the landing page
homepage: index

# User Guide
# ----------
# Custom directory for User Guide .qmd files (relative to project root).
# If not provided, looks for user_guide/ in the project root.
# user_guide: docs/guides
#
# For explicit control over section ordering and grouping:
# user_guide:
#   - section: "Get Started"
#     contents:
#       - text: "Welcome"
#         href: index.qmd
#       - quickstart.qmd
#       - installation.qmd
#   - section: "Advanced Topics"
#     contents:
#       - advanced-config.qmd
#       - extending.qmd
#
# File paths are relative to the user guide directory (no user_guide/ prefix).
# When using explicit ordering, numeric filename prefixes are preserved as-is.
user_guide: null

# Bibliography & Citations
# ------------------------
# Project-level bibliography for [@citation-key] syntax. Paths are relative to
# the project root; the file(s) are copied into the build directory and wired
# into _quarto.yml so every page can cite without per-page frontmatter.
# bibliography: docs/references.bib       # single file
# bibliography:                           # or multiple files
#   - docs/references.bib
#   - docs/software.bib
bibliography: []
# csl: docs/nature.csl                    # optional citation style
csl: null

# API Reference Structure
# -----------------------
# Explicit control over API reference sections. If not provided, sections are
# auto-generated from discovered exports. Each section has a title, description,
# and list of contents.
#
# For classes, use `members: true` (default) to document methods inline on the
# class page, or `members: false` to exclude methods (you can place them
# explicitly elsewhere in the reference if needed).
#
# reference:
#   - title: Core Classes
#     desc: Main classes for working with the package
#     contents:
#       - name: MyClass
#         members: false       # Don't document methods here
#       - SimpleClass          # Methods documented inline (default)
#
#   - title: Utility Functions
#     desc: Helper functions for common tasks
#     contents:
#       - helper_func
#       - another_func
reference: []

# Inline Methods
# --------------
# Whether class methods get their own pages or stay inline.
# true: always inline; false: always split; int: inline up to N, split above N.
inline_methods: 5

# Logo & Favicon
# --------------
# Point to a single logo file (replaces the text title in the navbar):
# logo: assets/logo.svg
#
# For light/dark variants:
# logo:
#   light: assets/logo-light.svg
#   dark: assets/logo-dark.svg
#
# To show the text title alongside the logo, add: show_title: true
logo: null

# Favicon.
# str: a single favicon file
# dict: {"icon", "apple_touch", "og_image"}
# null: auto-generate from the logo, else skip
favicon: null

# Hero Section
# ------------
# Landing-page hero.
# null: auto-enable when a logo is configured
# true/false: force enable/disable
# dict: {"enabled": bool, "logo": str|dict|false, "logo_height": str,
#        "name": str|false, "tagline": str|false, "badges": "auto"|list|false}
hero: null

# Markdown Pages
# --------------
# Generate .md companions for every HTML page and show a copy/view-as-Markdown
# widget on each page.  Set to false to disable both (default: true).
# markdown_pages: true
#
# To generate .md pages but hide the widget:
# markdown_pages:
#   widget: false
markdown_pages: true

# Announcement Banner
# -------------------
# Site-wide banner above the navbar.
# null/false: no banner
# str: banner message (plain text or inline HTML)
# dict: {"content": str, "type": "info"|"warning"|"success"|"danger",
#        "dismissable": bool, "url": str|None}
announcement: null

# Versioning
# ----------
# Multi-version documentation.
# null/[]: disabled (single-version site)
# list[str | dict]: ordered versions, newest first
#   Minimal: ["0.3", "0.2", "0.1"]
#   Full:    [{"tag": "0.3", "label": "0.3.0", "latest": true}, ...]
versions: []

# Version selector widget (enabled automatically when `versions` is non-empty).
version_selector:
  enabled: true
  # "navbar-right" | "navbar-left" | "sidebar-top"
  placement: navbar-right
  # Include end-of-life versions in the dropdown.
  show_eol: true
  # Show a banner on non-latest versions.
  warning_banner: true

# Floating version aliases.
version_aliases:
  # /v/latest/ -> latest stable version
  latest: true
  # /v/stable/ -> same as latest
  stable: true
  # /v/dev/ -> prerelease version, if any
  dev: true

# Colors & Navbar
# ---------------
# Site-wide accent color (any CSS color). Sets the --gd-accent property used by
# shortcodes, gradient presets, and other accent-colored elements.
# str: one color for both modes; dict: {"light": str, "dark": str}.
accent_color: null

# Navbar gradient preset (e.g. "sky", "peach", "lilac").
navbar_style: null

# Navbar solid background color (any CSS color). Text color is chosen
# automatically for contrast (APCA). Overridden when navbar_style is set.
# str: one color for both modes; dict: {"light": str, "dark": str}.
navbar_color: null

# Content-area gradient preset (same preset names as navbar_style); adds a
# subtle radial glow at the top of the content area.
# str: preset for all pages; dict: {"preset": str, "pages": "all"|"homepage"}.
content_style: null

# Scale to Fit
# ------------
# Auto-shrink wide HTML output to the content width. The matched element's
# nearest output wrapper is scaled down (never up).
# null/false: disabled
# list[str]: CSS selectors to auto-scale (e.g. ["#pb_tbl"])
# Per-page override: `scale-to-fit: ["#pb_tbl"]`
scale_to_fit: null

# Minimum scale for scale-to-fit; below it, content is shown full size with
# horizontal scrolling instead.
# null/false: no minimum
# float (0-1): minimum scale factor (e.g. 0.4 = don't shrink below 40%)
# str keyword: viewport breakpoint below which scaling is disabled —
#   "mobile" (≤ 576px), "tablet" (≤ 768px), "desktop" (≤ 992px)
# Per-page override: `scale-to-fit-min-scale: "tablet"`
scale_to_fit_min_scale: null

# Navigation Icons
# ----------------
# Lucide icons prepended to sidebar/navbar entries.
# null/false: disabled
# dict: {"navbar": {"Label": "icon-name"}, "sidebar": {"Label": "icon-name"}}
nav_icons: null

# UI Features
# -----------
# Keyboard shortcuts and help overlay.
keyboard_nav: true

# Auto-generated package-info page (dependency details), linked from homepage Meta.
package_info_page: true

# Back-to-top floating button.
back_to_top: true

# Footer attribution ("Site created with Great Docs").
attribution: true

# Custom Head HTML
# ----------------
# Injected into the <head> of every page.
# str: inline HTML (e.g. a <script> or <link> tag)
# list[str | dict]: inline strings or {"text": ...} / {"file": ...} entries
include_in_header: []

# Freeze (Execution Caching)
# --------------------------
# Whether computational documents re-run during builds.
# null/false: disabled — execute every document on every build
# "auto" (default): re-render only when source changes
# true: never re-render during project render
# dict: {"mode": "auto"|true, "pre_render": str|list[str]}
#   pre_render: script(s) to run before render (e.g. copy _freeze/ into the build dir)
freeze: auto

# Pre-render Scripts
# ------------------
# Quarto's native pre-render hook (alternative to freeze.pre_render). Copied
# into the build directory and wired into _quarto.yml.
# str: a single script path; list[str]: several. Paths are relative to root.
pre_render: null

# Agent Skills
# ------------
# Emits a SKILL.md conforming to the Agent Skills spec (https://agentskills.io/)
# so coding agents can learn the package.
skill:
  enabled: true
  # Path to a hand-written SKILL.md (overrides auto-generation).
  file: null
  # Also serve at /.well-known/agent-skills/{name}/SKILL.md + index.json.
  well_known: true
  # Strings for the Gotchas section.
  gotchas: []
  # Strings for the Best Practices section.
  best_practices: []
  # Manual decision-table rows: [{"need": "...", "use": "..."}].
  decision_table: []
  # Path to extra Markdown appended to the generated body.
  extra_body: null
  # Multiple named skills (overrides 'file' when set):
  # skills:
  #   - name: my-package
  #     file: skills/my-package/SKILL.md
  #   - name: authoring-pages
  #     file: skills/authoring-pages/SKILL.md
  skills: []

# Social Cards & Open Graph
# -------------------------
# Auto-generate <meta> tags for social media previews (LinkedIn, Discord, Slack,
# Bluesky, Mastodon, X/Twitter, and other platforms). Enabled by default.
# social_cards: true           # Enable with defaults (same as omitting the key)
# social_cards: false          # Disable social card meta tags
#
# Fine-grained control:
# social_cards:
#   enabled: true
#   image: assets/social-card.png   # Default og:image for all pages
#   twitter_site: "@myhandle"       # Twitter/X site @handle
#   twitter_card: summary_large_image  # "summary" or "summary_large_image"
social_cards:
  enabled: true
  image: null
  twitter_card: null
  twitter_site: null

# Page Status Badges
# ------------------
# Lifecycle indicators in sidebar navigation. Pages opt in via frontmatter
# (`status: new`, `deprecated`, ...).
# Shorthand: `page_status: true`/`false`.
page_status:
  # Master switch for page status badges.
  enabled: false
  # Show badges next to sidebar navigation links.
  show_in_sidebar: true
  # Show a status indicator below page titles (like tags).
  show_on_pages: true
  # Built-in status definitions (extend or override). Each: {label, icon, color, description}.
  statuses:
    new:
      label: New
      icon: sparkles
      color: "#10b981"
      description: Recently added
    updated:
      label: Updated
      icon: refresh-cw
      color: "#3b82f6"
      description: Recently updated
    beta:
      label: Beta
      icon: flask-conical
      color: "#f59e0b"
      description: Beta feature
    deprecated:
      label: Deprecated
      icon: triangle-alert
      color: "#ef4444"
      description: May be removed in a future release
    experimental:
      label: Experimental
      icon: beaker
      color: "#8b5cf6"
      description: API may change without notice
    upcoming:
      label: Upcoming
      icon: rocket
      color: "#e63946"
      description: Coming in a future release

# Page Tags
# ---------
# Categorize pages for discoverability via frontmatter
# (`tags: [Python, Testing, API]`).
# Shorthand: `tags: true`/`false`.
tags:
  # Master switch for page tags.
  enabled: false
  # Auto-generate a tags index page listing all tags and their pages.
  index_page: true
  # Render tag pills above page titles, linked to the tag index.
  show_on_pages: true
  # Support hierarchical tags with "/" (e.g. "Python/Testing").
  hierarchical: true
  # Optional tag icons: tag name -> Lucide icon name (e.g. {"Python": "code"}).
  icons: {}
  # Shadow tags: names hidden from public view (internal organization only).
  # Shadow-tagged pages are indexed but their tags are not rendered.
  shadow: []
  # When true, section pages show a tag cloud scoped to that section.
  scoped: false
  # Default tag pill placement: "top" or "bottom".
  location: top

# SEO
# ---
# Generates sitemap.xml, robots.txt, and discoverability metadata.
seo:
  # Master switch for all SEO features.
  enabled: true
  sitemap:
    # Generate sitemap.xml.
    enabled: true
    # Change frequency by page type (always|hourly|daily|weekly|monthly|yearly|never).
    changefreq:
      homepage: weekly
      reference: monthly
      user_guide: monthly
      changelog: weekly
      default: monthly
    # Priority by page type (0.0-1.0).
    priority:
      homepage: 1.0
      reference: 0.8
      user_guide: 0.9
      changelog: 0.6
      default: 0.5
  robots:
    # Generate robots.txt.
    enabled: true
    # Allow all crawlers by default.
    allow_all: true
    # Paths to disallow (e.g. ["/drafts/", "/_internal/"]).
    disallow: []
    # Optional crawl delay in seconds.
    crawl_delay: null
    # Extra rules as raw strings (e.g. ["User-agent: GPTBot", "Disallow: /"]).
    extra_rules: []
  canonical:
    # Add canonical URLs to pages.
    enabled: true
    # Base URL (e.g. "https://example.github.io/pkg/"); auto-detected from
    # GitHub Pages when null.
    base_url: null
  # Page title template; supports {page_title} and {site_name}.
  title_template: "{page_title} | {site_name}"
  # JSON-LD structured data for software documentation.
  structured_data:
    # Add JSON-LD to pages.
    enabled: true
    # Schema.org type.
    type: SoftwareSourceCode
  # Default meta description; falls back to the package description when null.
  default_description: null
