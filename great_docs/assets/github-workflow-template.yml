name: CI Docs

on:
  push:
    branches:
      - { main_branch }
  pull_request:

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "{python_version}"

      - name: Install package and dependencies
        run: |
{install_commands}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: {build_command}

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Preview these docs locally::great-docs preview --run ${{ github.run_id }}"
          echo ""
          echo "  # this exact build:"
          echo "  pipx run great-docs preview --run ${{ github.run_id }}"
          echo ""
          echo "  # or always the latest build for this PR:"
          echo "  pipx run great-docs preview --pr ${{ github.event.number }}"
          echo ""
          echo "  Auth: 'gh auth login' then add --use-gh, or set GITHUB_TOKEN (Actions:read)."

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/{main_branch}'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Post (and keep updated) a sticky comment telling reviewers how to fetch
      # this build and view it locally with `great-docs preview` — no preview
      # host required. Pinned to this run so it reproduces the build under review.
      # Uses the first-party actions/github-script (no third-party action);
      # continue-on-error so fork PRs (read-only token) don't fail the run.
      - name: Post preview instructions to the PR
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const marker = '<!-- great-docs:docs-preview -->';
            const body = [
              marker,
              "### 📚 Preview this PR's docs locally",
              '',
              'No hosting setup — fetch the site CI just built and open it in your browser:',
              '',
              '```bash',
              '# this exact build',
              `pipx run great-docs preview --run ${process.env.RUN_ID}`,
              '',
              '# or always the latest build for this PR',
              `pipx run great-docs preview --pr ${process.env.PR_NUMBER}`,
              '```',
              '',
              '**Auth:** run `gh auth login` then add `--use-gh`, or set `GITHUB_TOKEN` (needs *Actions: read*).',
              '**Tip:** add `--path reference/index.html` to jump straight to a page.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
